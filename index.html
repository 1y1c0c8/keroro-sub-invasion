<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KeroroBase">
  <meta name="description" content="Keroro軍曹：藍星地下侵略計畫 — 地面侵略關卡（動作畫面）手機觸控原型">
  <title>Keroro藍星地下侵略計畫</title>

  <!-- PWA：Web App Manifest 與圖示（路徑需與 manifest.json / sw.js 一致） -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1b0f;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    /* 遊戲舞台：16:9 等比縮放置中（letterbox），不拉伸畫質 */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      display: block;
      background: #8fd3ff;
      touch-action: none;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    /* 半透明虛擬按鍵（僅手機 / 觸控裝置顯示） */
    #controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 10;
    }

    body.touch #controls {
      display: block;
    }

    .pad {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: clamp(10px, 2.5vh, 20px);
      pointer-events: none;
    }

    .pad.left {
      left: calc(18px + env(safe-area-inset-left));
    }

    .pad.right {
      right: calc(18px + env(safe-area-inset-right));
    }

    .btn {
      pointer-events: auto;
      touch-action: none;
      width: clamp(64px, 19vh, 112px);
      height: clamp(64px, 19vh, 112px);
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.92);
      font-weight: 900;
      font-size: clamp(14px, 4.2vh, 22px);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      transition: transform 0.06s, background 0.06s;
    }

    .btn.arrow {
      font-size: clamp(22px, 7vh, 38px);
    }

    .btn.jump {
      width: clamp(76px, 24vh, 136px);
      height: clamp(76px, 24vh, 136px);
      margin-bottom: clamp(20px, 8vh, 56px);
    }

    .btn.active {
      background: rgba(255, 255, 255, 0.42);
      transform: scale(0.93);
    }

    .btn.skill.ready {
      border-color: rgba(255, 214, 0, 0.95);
      color: #fff6c2;
      animation: skillPulse 0.9s ease-in-out infinite;
    }

    @keyframes skillPulse {
      0%, 100% { box-shadow: 0 0 6px rgba(255, 214, 0, 0.5); }
      50% { box-shadow: 0 0 26px rgba(255, 214, 0, 0.95); }
    }

    /* 直拿手機時的「請轉橫向」提示遮罩 */
    #rotate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #1b3a1f;
      color: #fff;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;
    }

    #rotate .phone {
      width: 56px;
      height: 92px;
      border: 5px solid #8bc34a;
      border-radius: 12px;
      animation: rotatePhone 1.8s ease-in-out infinite;
    }

    @keyframes rotatePhone {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="地面侵略關卡遊戲畫面"></canvas>
  </div>

  <!-- 虛擬按鍵：左側移動、右側 JUMP / SKILL -->
  <div id="controls" aria-hidden="true">
    <div class="pad left">
      <div class="btn arrow" data-key="left">◀</div>
      <div class="btn arrow" data-key="right">▶</div>
    </div>
    <div class="pad right">
      <div class="btn skill" data-key="skill" id="skillBtn">SKILL</div>
      <div class="btn jump" data-key="jump">JUMP</div>
    </div>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <div>請將手機旋轉至橫向<br>以獲得最佳體驗</div>
  </div>

  <script>
    (() => {
      'use strict';

      // ===== 基本設定 =====
      const W = 1280;              // 邏輯解析度（16:9）
      const H = 720;
      const GROUND_Y = 630;        // 地面高度
      const GAME_TIME = 60;        // 倒數秒數
      const MAX_HP = 3;

      const PLAYER = {
        size: 56,
        speed: 430,                // Keroro：移動速度中等
        jumpV: 1180,               // Keroro：跳躍力高
        gravity: 2700
      };

      const RESONANCE_MAX = 100;
      const RESONANCE_PER_GUNPLA = 14;
      const RESONANCE_PER_SEC = 1.5;
      const SKILL_DURATION = 3;    // 鋼普拉修復：無敵 3 秒 + 吸引鋼普拉
      const REVERSE_DURATION = 3;  // 冬樹護身符：方向反轉 3 秒

      const COMIC_FONT = '"Comic Sans MS", "Chalkboard SE", "Arial Black", "PingFang TC", "Microsoft JhengHei", sans-serif';
      const UI_FONT = '-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const skillBtn = document.getElementById('skillBtn');

      // ===== 工具函式 =====
      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function circleRect(cx, cy, r, rect) {
        const nx = clamp(cx, rect.x, rect.x + rect.w);
        const ny = clamp(cy, rect.y, rect.y + rect.h);
        const dx = cx - nx;
        const dy = cy - ny;
        return dx * dx + dy * dy < r * r;
      }

      function loadBest() {
        try {
          return Number(localStorage.getItem('keroro.best')) || 0;
        } catch (e) {
          return 0;
        }
      }

      function saveBest(v) {
        try {
          localStorage.setItem('keroro.best', String(v));
        } catch (e) {
          /* 私密模式等情況下忽略 */
        }
      }

      // ===== RWD：16:9 等比縮放 + 高 DPI =====
      function resize() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / W, vh / H);
        const cssW = Math.floor(W * scale);
        const cssH = Math.floor(H * scale);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 200));
      resize();

      // ===== 輸入：鍵盤 + 觸控雙模 =====
      const input = { left: false, right: false, jump: false, skill: false };
      const pressed = { jump: false, skill: false };   // 本幀按下（edge）

      function setKey(name, down) {
        if (down && !input[name] && name in pressed) pressed[name] = true;
        input[name] = down;
      }

      function clearInput() {
        input.left = input.right = input.jump = input.skill = false;
        pressed.jump = pressed.skill = false;
        document.querySelectorAll('.btn.active').forEach((b) => b.classList.remove('active'));
      }

      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      if (isTouchDevice) document.body.classList.add('touch');

      const KEY_MAP = {
        ArrowLeft: 'left', KeyA: 'left',
        ArrowRight: 'right', KeyD: 'right',
        Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
        KeyL: 'skill'
      };

      window.addEventListener('keydown', (e) => {
        // PC 端使用鍵盤時隱藏虛擬按鍵
        document.body.classList.remove('touch');
        if (state !== 'playing' && (e.code === 'Space' || e.code === 'Enter')) {
          e.preventDefault();
          if (!e.repeat) handleStartTap();
          return;
        }
        const k = KEY_MAP[e.code];
        if (k) {
          e.preventDefault();
          setKey(k, true);
        }
      });

      window.addEventListener('keyup', (e) => {
        const k = KEY_MAP[e.code];
        if (k) {
          e.preventDefault();
          setKey(k, false);
        }
      });

      window.addEventListener('blur', clearInput);

      // 虛擬按鍵：支援多點觸控（同時按移動 + 跳躍）
      document.querySelectorAll('[data-key]').forEach((btn) => {
        const key = btn.dataset.key;
        const pointers = new Set();
        const sync = () => {
          const down = pointers.size > 0;
          setKey(key, down);
          btn.classList.toggle('active', down);
        };
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (state !== 'playing') {
            handleStartTap();
            return;
          }
          try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          pointers.add(e.pointerId);
          sync();
        });
        const release = (e) => {
          pointers.delete(e.pointerId);
          sync();
        };
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('lostpointercapture', release);
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      });

      document.addEventListener('touchstart', () => document.body.classList.add('touch'), { passive: true });
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') document.body.classList.add('touch');
        if (state !== 'playing') handleStartTap();
      });

      // 首次互動時嘗試全螢幕並鎖定橫向（非 standalone 模式的手機瀏覽器）
      function tryFullscreenLandscape() {
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
        if (!isTouchDevice || standalone) return;
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req && !document.fullscreenElement) {
          Promise.resolve(req.call(el))
            .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
            .catch(() => { /* iOS Safari 等不支援時忽略 */ });
        }
      }

      // ===== 遊戲狀態 =====
      let state = 'title';   // title | playing | paused | win | lose
      let player;
      let hazards;           // 上方掉落物
      let gunplas;           // 鋼普拉（金色圓圈）
      let strikes;           // 夏美木刀預警
      let effects;           // 動漫文字特效
      let particles;
      let timeLeft, score, resonance, hp, elapsed;
      let spawnT, gunplaT, strikeT;
      let shake = 0;
      let resultT = 0;
      let best = loadBest();
      let newBest = false;
      let skillReadyShown = false;

      function resetGame() {
        player = {
          x: W / 2 - PLAYER.size / 2,
          y: GROUND_Y - PLAYER.size,
          w: PLAYER.size,
          h: PLAYER.size,
          vx: 0,
          vy: 0,
          onGround: true,
          facing: 1,
          iframe: 0,
          skillT: 0,
          reverseT: 0,
          coyote: 0,
          jumpBuf: 0,
          squash: 0
        };
        hazards = [];
        gunplas = [];
        strikes = [];
        effects = [];
        particles = [];
        timeLeft = GAME_TIME;
        score = 0;
        resonance = 0;
        hp = MAX_HP;
        elapsed = 0;
        spawnT = 1.2;
        gunplaT = 0.6;
        strikeT = 9;
        shake = 0;
        newBest = false;
        skillReadyShown = false;
      }

      function handleStartTap() {
        if (state === 'paused') {
          clearInput();
          state = 'playing';
          return;
        }
        if ((state === 'win' || state === 'lose') && resultT < 0.8) return;   // 避免誤觸立即重開
        if (state === 'title' || state === 'win' || state === 'lose') {
          tryFullscreenLandscape();
          resetGame();
          clearInput();
          state = 'playing';
          addEffect('Kero!', player.x + player.w / 2, player.y - 30, '#7cff4f', 64);
        }
      }

      function endGame(result) {
        state = result;
        resultT = 0;
        clearInput();
        if (result === 'win') score += hp * 500;   // 存活獎勵
        if (score > best) {
          best = score;
          newBest = true;
          saveBest(best);
        }
      }

      // 切到背景或直拿手機時自動暫停
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'playing') state = 'paused';
      });
      const portraitMQ = window.matchMedia('(orientation: portrait) and (pointer: coarse)');
      const onPortrait = () => {
        if (portraitMQ.matches && state === 'playing') state = 'paused';
      };
      if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', onPortrait);
      else if (portraitMQ.addListener) portraitMQ.addListener(onPortrait);

      // ===== 特效 =====
      function addEffect(text, x, y, color, size = 48) {
        effects.push({ text, x, y, color, size, t: 0, life: 0.9, rot: rand(-0.2, 0.2) });
      }

      function burst(x, y, color, n = 10, speed = 300) {
        for (let i = 0; i < n; i++) {
          const a = rand(0, Math.PI * 2);
          const s = rand(speed * 0.3, speed);
          particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, t: 0, life: rand(0.35, 0.7), r: rand(3, 7), color });
        }
      }

      // ===== 生成物件 =====
      function spawnHazard() {
        const isAmulet = elapsed > 5 && Math.random() < 0.14;   // 冬樹的超古代遺跡護身符
        const size = isAmulet ? 44 : rand(38, 70);
        // 有 35% 機率瞄準玩家附近，增加閃躲壓力
        const targetX = Math.random() < 0.35 ? player.x + rand(-120, 120) : rand(0, W);
        hazards.push({
          type: isAmulet ? 'amulet' : 'debris',
          x: clamp(targetX, 10, W - size - 10),
          y: -size - 10,
          w: size,
          h: size,
          vy: rand(220, 380) + elapsed * 4,
          rot: rand(0, Math.PI),
          vr: rand(-4, 4),
          hue: Math.floor(rand(0, 4))
        });
      }

      function spawnGunpla() {
        gunplas.push({
          x: rand(60, W - 60),
          y: rand(GROUND_Y - 300, GROUND_Y - 40),
          r: 20,
          life: 6,
          t: rand(0, Math.PI * 2)
        });
      }

      function spawnStrike() {
        // 日向夏美：紅色預警線，1 秒後木刀砸下
        const w = 170;
        const x = clamp(player.x + player.w / 2 - w / 2 + rand(-160, 160), 0, W - w);
        strikes.push({ x, w, warn: 1, hit: 0, done: false });
      }

      // ===== 傷害與技能 =====
      function isInvincible() {
        return player.skillT > 0 || player.iframe > 0;
      }

      function damage(n) {
        if (isInvincible()) return;
        hp -= n;
        player.iframe = 1.3;
        shake = n > 1 ? 18 : 10;
        addEffect(n > 1 ? 'BOOM!!' : 'BOOM!', player.x + player.w / 2, player.y - 20, '#ff3b3b', n > 1 ? 72 : 56);
        burst(player.x + player.w / 2, player.y + player.h / 2, '#ff7043', 14, 380);
        if (hp <= 0) {
          hp = 0;
          endGame('lose');
        }
      }

      function useSkill() {
        if (resonance >= RESONANCE_MAX) {
          resonance = 0;
          player.skillT = SKILL_DURATION;
          skillReadyShown = false;
          shake = 8;
          addEffect('鋼普拉修復!', player.x + player.w / 2, player.y - 40, '#ffd600', 60);
          burst(player.x + player.w / 2, player.y + player.h / 2, '#ffd600', 24, 460);
        } else {
          addEffect('共鳴不足…', player.x + player.w / 2, player.y - 30, '#cfd8dc', 32);
        }
      }

      // ===== 更新 =====
      function update(dt) {
        updateEffects(dt);
        if (state !== 'playing') {
          if (state === 'win' || state === 'lose') resultT += dt;
          pressed.jump = pressed.skill = false;
          return;
        }

        elapsed += dt;
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          addEffect('侵略成功!', W / 2, H / 2 - 40, '#7cff4f', 80);
          endGame('win');
          return;
        }

        const progress = clamp(elapsed / GAME_TIME, 0, 1);
        resonance = clamp(resonance + RESONANCE_PER_SEC * dt, 0, RESONANCE_MAX);
        if (resonance >= RESONANCE_MAX && !skillReadyShown) {
          skillReadyShown = true;
          addEffect('SKILL READY!', W / 2, 150, '#ffd600', 44);
        }

        updatePlayer(dt);
        if (pressed.skill) useSkill();
        pressed.jump = pressed.skill = false;

        // 掉落物
        spawnT -= dt;
        if (spawnT <= 0) {
          spawnHazard();
          spawnT = lerp(0.95, 0.3, progress) * rand(0.7, 1.3);
        }
        updateHazards(dt);

        // 夏美木刀
        if (elapsed > 8) {
          strikeT -= dt;
          if (strikeT <= 0) {
            spawnStrike();
            strikeT = lerp(8, 4, progress) * rand(0.8, 1.2);
          }
        }
        updateStrikes(dt);

        // 鋼普拉
        gunplaT -= dt;
        if (gunplaT <= 0) {
          spawnGunpla();
          gunplaT = rand(0.9, 1.6);
        }
        updateGunplas(dt);

        if (shake > 0) shake = Math.max(0, shake - 60 * dt);
      }

      function updatePlayer(dt) {
        const p = player;
        let dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        if (p.reverseT > 0) dir = -dir;                 // 護身符：方向反轉
        if (dir !== 0) p.facing = dir;

        const targetVx = dir * PLAYER.speed;
        p.vx += (targetVx - p.vx) * Math.min(1, dt * (p.onGround ? 16 : 9));

        // 跳躍：緩衝輸入 + 土狼時間，手感較寬容
        if (pressed.jump) p.jumpBuf = 0.12;
        p.jumpBuf = Math.max(0, p.jumpBuf - dt);
        p.coyote = p.onGround ? 0.1 : Math.max(0, p.coyote - dt);
        if (p.jumpBuf > 0 && p.coyote > 0) {
          p.vy = -PLAYER.jumpV;
          p.onGround = false;
          p.coyote = 0;
          p.jumpBuf = 0;
          p.squash = -0.25;
          burst(p.x + p.w / 2, GROUND_Y, '#ffffff', 6, 160);
        }

        // 放開 JUMP 時加重重力 → 可控跳躍高度
        const g = (!input.jump && p.vy < 0) ? PLAYER.gravity * 2.2 : PLAYER.gravity;
        p.vy += g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.y + p.h >= GROUND_Y) {
          if (!p.onGround && p.vy > 600) {
            p.squash = 0.25;
            burst(p.x + p.w / 2, GROUND_Y, '#ffffff', 5, 120);
          }
          p.y = GROUND_Y - p.h;
          p.vy = 0;
          p.onGround = true;
        } else {
          p.onGround = false;
        }
        p.x = clamp(p.x, 0, W - p.w);

        p.iframe = Math.max(0, p.iframe - dt);
        p.skillT = Math.max(0, p.skillT - dt);
        p.reverseT = Math.max(0, p.reverseT - dt);
        p.squash *= Math.pow(0.0001, dt);
      }

      function playerHitbox() {
        const m = 7;
        return { x: player.x + m, y: player.y + m, w: player.w - m * 2, h: player.h - m * 2 };
      }

      function updateHazards(dt) {
        const hb = playerHitbox();
        for (let i = hazards.length - 1; i >= 0; i--) {
          const h = hazards[i];
          h.vy += 700 * dt;
          h.y += h.vy * dt;
          h.rot += h.vr * dt;

          if (rectsOverlap(h, hb)) {
            hazards.splice(i, 1);
            if (player.skillT > 0) {
              score += 30;
              addEffect('Kero!', h.x + h.w / 2, h.y, '#7cff4f', 44);
              burst(h.x + h.w / 2, h.y + h.h / 2, '#ffd600', 10, 300);
            } else if (h.type === 'amulet') {
              player.reverseT = REVERSE_DURATION;
              addEffect('方向反轉!?', player.x + player.w / 2, player.y - 30, '#d17bff', 46);
              burst(h.x + h.w / 2, h.y + h.h / 2, '#b388ff', 12, 280);
            } else {
              damage(1);
            }
            continue;
          }

          if (h.y + h.h >= GROUND_Y) {
            burst(h.x + h.w / 2, GROUND_Y, h.type === 'amulet' ? '#b388ff' : '#a1887f', 6, 200);
            hazards.splice(i, 1);
          }
        }
      }

      function updateStrikes(dt) {
        const hb = playerHitbox();
        for (let i = strikes.length - 1; i >= 0; i--) {
          const s = strikes[i];
          if (s.warn > 0) {
            s.warn -= dt;
            if (s.warn <= 0) {
              s.hit = 0.3;
              shake = Math.max(shake, 16);
              addEffect('BOOM!', s.x + s.w / 2, GROUND_Y - 80, '#ff5252', 70);
              burst(s.x + s.w / 2, GROUND_Y, '#d7ccc8', 18, 420);
              if (hb.x < s.x + s.w && hb.x + hb.w > s.x) {
                if (player.skillT > 0) addEffect('無敵!', player.x + player.w / 2, player.y - 30, '#ffd600', 40);
                else damage(2);   // 巨量傷害
              }
            }
          } else {
            s.hit -= dt;
            if (s.hit <= 0) strikes.splice(i, 1);
          }
        }
      }

      function updateGunplas(dt) {
        const hb = playerHitbox();
        const pcx = player.x + player.w / 2;
        const pcy = player.y + player.h / 2;
        for (let i = gunplas.length - 1; i >= 0; i--) {
          const g = gunplas[i];
          g.t += dt;
          g.life -= dt;

          // 技能：自動吸引畫面上的鋼普拉
          if (player.skillT > 0) {
            const dx = pcx - g.x;
            const dy = pcy - g.y;
            const d = Math.hypot(dx, dy) || 1;
            const sp = 950 * dt;
            g.x += (dx / d) * Math.min(sp, d);
            g.y += (dy / d) * Math.min(sp, d);
          }

          if (circleRect(g.x, g.y, g.r + 6, hb)) {
            gunplas.splice(i, 1);
            score += 100;
            resonance = clamp(resonance + RESONANCE_PER_GUNPLA, 0, RESONANCE_MAX);
            addEffect('+100', g.x, g.y - 20, '#ffd600', 36);
            burst(g.x, g.y, '#ffe082', 10, 260);
            continue;
          }
          if (g.life <= 0) gunplas.splice(i, 1);
        }
      }

      function updateEffects(dt) {
        if (!effects) return;
        for (let i = effects.length - 1; i >= 0; i--) {
          const e = effects[i];
          e.t += dt;
          e.y -= 50 * dt;
          if (e.t >= e.life) effects.splice(i, 1);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.t += dt;
          p.vy += 900 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.t >= p.life) particles.splice(i, 1);
        }
      }

      // ===== 繪圖 =====
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawBackground() {
        // 天空
        const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        sky.addColorStop(0, '#5ec2ff');
        sky.addColorStop(1, '#c9ecff');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, GROUND_Y);

        // 雲
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        const t = performance.now() / 1000;
        for (let i = 0; i < 4; i++) {
          const cx = ((i * 380 + t * (12 + i * 4)) % (W + 300)) - 150;
          const cy = 110 + (i % 2) * 70;
          ctx.beginPath();
          ctx.arc(cx, cy, 34, 0, Math.PI * 2);
          ctx.arc(cx + 40, cy - 14, 42, 0, Math.PI * 2);
          ctx.arc(cx + 86, cy, 32, 0, Math.PI * 2);
          ctx.fill();
        }

        // 藍星街道：遠景房屋剪影
        const houses = [
          [40, 180, 230, '#ffcc80'], [270, 150, 190, '#ef9a9a'], [480, 210, 260, '#fff59d'],
          [760, 170, 210, '#a5d6a7'], [980, 160, 240, '#90caf9'], [1170, 140, 180, '#ce93d8']
        ];
        houses.forEach(([x, w, h, c]) => {
          const y = GROUND_Y - h;
          ctx.fillStyle = c;
          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = 'rgba(0,0,0,0.12)';
          ctx.beginPath();
          ctx.moveTo(x - 12, y);
          ctx.lineTo(x + w / 2, y - 50);
          ctx.lineTo(x + w + 12, y);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          for (let wy = y + 30; wy < GROUND_Y - 60; wy += 70) {
            for (let wx = x + 22; wx < x + w - 40; wx += 60) {
              ctx.fillRect(wx, wy, 30, 30);
            }
          }
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);
        });

        // 地面
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, GROUND_Y, W, 18);
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(0, GROUND_Y + 18, W, H - GROUND_Y - 18);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        for (let x = 0; x < W; x += 80) ctx.fillRect(x, GROUND_Y + 40, 40, 6);
        ctx.strokeStyle = '#33691e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(W, GROUND_Y);
        ctx.stroke();
      }

      function drawStrikes() {
        strikes.forEach((s) => {
          if (s.warn > 0) {
            // 紅色預警線（閃爍）
            const blink = Math.floor(s.warn * 10) % 2 === 0;
            ctx.fillStyle = blink ? 'rgba(255,0,0,0.28)' : 'rgba(255,0,0,0.14)';
            ctx.fillRect(s.x, 0, s.w, GROUND_Y);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(s.x, GROUND_Y - 8, s.w, 8);
            ctx.strokeStyle = 'rgba(255,23,68,0.9)';
            ctx.setLineDash([16, 10]);
            ctx.lineWidth = 3;
            ctx.strokeRect(s.x, 0, s.w, GROUND_Y);
            ctx.setLineDash([]);
            ctx.font = `900 34px ${UI_FONT}`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#fff';
            ctx.strokeText('⚠ 夏美!', s.x + s.w / 2, 230);
            ctx.fillStyle = '#d50000';
            ctx.fillText('⚠ 夏美!', s.x + s.w / 2, 230);
          } else {
            // 木刀砸下
            const k = clamp(s.hit / 0.3, 0, 1);
            ctx.save();
            ctx.globalAlpha = 0.4 + 0.6 * k;
            ctx.fillStyle = '#d7a86e';
            roundRect(s.x + s.w / 2 - 36, 0, 72, GROUND_Y, 18);
            ctx.fill();
            ctx.strokeStyle = '#6d4c41';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(s.x, GROUND_Y - 30, s.w, 30);
            ctx.restore();
          }
        });
      }

      const DEBRIS_COLORS = ['#8d6e63', '#78909c', '#ff8a65', '#4db6ac'];

      function drawHazards() {
        hazards.forEach((h) => {
          ctx.save();
          ctx.translate(h.x + h.w / 2, h.y + h.h / 2);
          ctx.rotate(h.rot);
          if (h.type === 'amulet') {
            ctx.fillStyle = '#7e57c2';
            roundRect(-h.w / 2, -h.h / 2, h.w, h.h, 8);
            ctx.fill();
            ctx.strokeStyle = '#ede7f6';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `900 24px ${UI_FONT}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('符', 0, 1);
          } else {
            ctx.fillStyle = DEBRIS_COLORS[h.hue];
            roundRect(-h.w / 2, -h.h / 2, h.w, h.h, 6);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(-h.w / 2 + 6, -h.h / 2 + 6, h.w * 0.35, h.h * 0.2);
          }
          ctx.restore();
        });
        ctx.textBaseline = 'alphabetic';
      }

      function drawGunplas() {
        gunplas.forEach((g) => {
          if (g.life < 1.5 && Math.floor(g.life * 8) % 2 === 0) return;   // 即將消失時閃爍
          const y = g.y + Math.sin(g.t * 4) * 5;
          ctx.save();
          ctx.shadowColor = 'rgba(255,214,0,0.9)';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#ffc400';
          ctx.beginPath();
          ctx.arc(g.x, y, g.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.strokeStyle = '#ff8f00';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(g.x, y, g.r - 2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#fff8e1';
          ctx.beginPath();
          ctx.arc(g.x - 6, y - 6, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawPlayer() {
        const p = player;
        if (p.iframe > 0 && Math.floor(p.iframe * 14) % 2 === 0) return;   // 受擊閃爍

        const sx = 1 + p.squash;
        const sy = 1 - p.squash;
        const cx = p.x + p.w / 2;
        const by = p.y + p.h;

        ctx.save();
        ctx.translate(cx, by);
        ctx.scale(sx, sy);

        // 技能：金色光環
        if (p.skillT > 0) {
          const pulse = 1 + Math.sin(performance.now() / 70) * 0.08;
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = '#ffd600';
          ctx.beginPath();
          ctx.arc(0, -p.h / 2, p.w * 0.95 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 身體（綠色方塊 = Keroro）
        ctx.fillStyle = p.reverseT > 0 ? '#9ccc65' : '#43a047';
        roundRect(-p.w / 2, -p.h, p.w, p.h, 10);
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 帽子上的黃色星星
        drawStar(0, -p.h + 14, 9, 4, '#ffeb3b');

        // 眼睛（朝向移動方向）
        const ex = p.facing * 4;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-12 + ex, -p.h + 30, 9, 0, Math.PI * 2);
        ctx.arc(12 + ex, -p.h + 30, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(-12 + ex + p.facing * 3, -p.h + 30, 4, 0, Math.PI * 2);
        ctx.arc(12 + ex + p.facing * 3, -p.h + 30, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 反轉狀態提示
        if (p.reverseT > 0) {
          ctx.font = `900 30px ${UI_FONT}`;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#7e57c2';
          ctx.fillText('⇄ ' + p.reverseT.toFixed(1), cx, p.y - 14);
        }
      }

      function drawStar(x, y, outer, inner, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? outer : inner;
          const a = -Math.PI / 2 + (i * Math.PI) / 5;
          const px = x + Math.cos(a) * r;
          const py = y + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#f57f17';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      function drawParticles() {
        particles.forEach((p) => {
          ctx.globalAlpha = 1 - p.t / p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawEffects() {
        effects.forEach((e) => {
          const k = e.t / e.life;
          const pop = k < 0.15 ? lerp(0.4, 1.15, k / 0.15) : lerp(1.15, 1, Math.min(1, (k - 0.15) / 0.2));
          ctx.save();
          ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
          ctx.translate(e.x, e.y);
          ctx.rotate(e.rot);
          ctx.scale(pop, pop);
          ctx.font = `italic 900 ${e.size}px ${COMIC_FONT}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          ctx.lineWidth = e.size / 5;
          ctx.strokeStyle = '#111';
          ctx.strokeText(e.text, 0, 0);
          ctx.fillStyle = e.color;
          ctx.fillText(e.text, 0, 0);
          ctx.restore();
        });
        ctx.textBaseline = 'alphabetic';
      }

      function drawHUD() {
        // 頂部狀態欄背景
        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        roundRect(16, 12, W - 32, 72, 16);
        ctx.fill();

        // 倒數時間
        const secs = Math.ceil(timeLeft);
        ctx.font = `900 40px ${UI_FONT}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = secs <= 10 && Math.floor(timeLeft * 4) % 2 === 0 ? '#ff5252' : '#ffffff';
        ctx.fillText('⏱ ' + secs, 40, 48);

        // HP
        ctx.font = `28px ${UI_FONT}`;
        let hearts = '';
        for (let i = 0; i < MAX_HP; i++) hearts += i < hp ? '❤' : '♡';
        ctx.fillStyle = '#ff6b81';
        ctx.fillText(hearts, 170, 48);

        // 共鳴值充能條
        const bx = 400;
        const bw = 440;
        const by = 34;
        const bh = 28;
        const ready = resonance >= RESONANCE_MAX;
        ctx.font = `800 22px ${UI_FONT}`;
        ctx.fillStyle = '#e0f2f1';
        ctx.textAlign = 'right';
        ctx.fillText('共鳴值', bx - 12, 48);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        roundRect(bx, by, bw, bh, 14);
        ctx.fill();
        const fillW = (bw - 6) * (resonance / RESONANCE_MAX);
        if (fillW > 1) {
          const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
          grad.addColorStop(0, '#26c6da');
          grad.addColorStop(1, ready ? '#ffd600' : '#76ff03');
          ctx.fillStyle = grad;
          roundRect(bx + 3, by + 3, Math.max(fillW, 16), bh - 6, 11);
          ctx.fill();
        }
        ctx.strokeStyle = ready ? '#ffd600' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 3;
        roundRect(bx, by, bw, bh, 14);
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.font = `900 18px ${UI_FONT}`;
        ctx.fillStyle = '#102027';
        if (ready) {
          ctx.globalAlpha = 0.6 + Math.sin(performance.now() / 120) * 0.4;
          ctx.fillText(document.body.classList.contains('touch') ? 'SKILL READY!' : 'SKILL READY! [L]', bx + bw / 2, 49);
          ctx.globalAlpha = 1;
        } else if (player.skillT > 0) {
          ctx.fillStyle = '#fff';
          ctx.fillText('鋼普拉修復中 ' + player.skillT.toFixed(1) + 's', bx + bw / 2, 49);
        }

        // 當前得分
        ctx.textAlign = 'right';
        ctx.font = `900 36px ${UI_FONT}`;
        ctx.fillStyle = '#ffd600';
        ctx.fillText('SCORE ' + score, W - 40, 48);
        ctx.textBaseline = 'alphabetic';
      }

      function drawOverlay(title, lines, titleColor) {
        ctx.fillStyle = 'rgba(10,30,12,0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.font = `italic 900 76px ${COMIC_FONT}`;
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#111';
        ctx.strokeText(title, W / 2, 230);
        ctx.fillStyle = titleColor;
        ctx.fillText(title, W / 2, 230);
        lines.forEach((l, i) => {
          ctx.font = `${l.bold ? 800 : 500} ${l.size || 28}px ${UI_FONT}`;
          ctx.fillStyle = l.color || '#ffffff';
          ctx.fillText(l.text, W / 2, 330 + i * 52);
        });
        ctx.textBaseline = 'alphabetic';
      }

      function controlsHint() {
        return document.body.classList.contains('touch')
          ? '◀ ▶ 移動　JUMP 跳躍　SKILL 必殺技（共鳴值滿時）'
          : 'A / D 或 ← → 移動　Space 跳躍　L 必殺技（共鳴值滿時）';
      }

      function startHint() {
        return document.body.classList.contains('touch') ? '▶ 點擊畫面開始' : '▶ 按 Space / Enter 或點擊畫面開始';
      }

      function render() {
        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        drawBackground();
        if (player) {
          drawStrikes();
          drawGunplas();
          drawHazards();
          drawPlayer();
          drawParticles();
          drawEffects();
        }
        ctx.restore();
        if (player) drawHUD();

        const blink = Math.floor(performance.now() / 500) % 2 === 0;
        if (state === 'title') {
          drawOverlay('Keroro藍星地下侵略計畫', [
            { text: '地面侵略關卡｜藍星街道', size: 32, bold: true, color: '#aed581' },
            { text: '閃躲人類攻擊、收集金色鋼普拉，撐過 60 秒！', size: 26 },
            { text: '小心夏美的紅色預警線與冬樹的護身符（方向反轉）', size: 22, color: '#ffcdd2' },
            { text: controlsHint(), size: 22, color: '#b2ebf2' },
            { text: blink ? startHint() : '', size: 30, bold: true, color: '#ffd600' }
          ], '#7cff4f');
        } else if (state === 'paused') {
          drawOverlay('PAUSE', [
            { text: '遊戲已暫停', size: 30, bold: true },
            { text: blink ? '▶ 點擊畫面繼續' : '', size: 28, bold: true, color: '#ffd600' }
          ], '#ffffff');
        } else if (state === 'win' || state === 'lose') {
          const win = state === 'win';
          drawOverlay(win ? '侵略成功！Kero!' : '侵略失敗…', [
            { text: win ? '成功撐過 60 秒，帶著鋼普拉返回地下基地！' : '被人類擊退了，回地下基地重整旗鼓吧…', size: 26 },
            { text: `得分 ${score}${win ? `（含存活獎勵 ${hp * 500}）` : ''}`, size: 34, bold: true, color: '#ffd600' },
            { text: newBest ? '★ 新紀錄！★' : `最高紀錄 ${best}`, size: 26, bold: true, color: newBest ? '#ff80ab' : '#b2ebf2' },
            { text: resultT > 0.8 && blink ? '▶ 點擊畫面再玩一次' : '', size: 28, bold: true, color: '#ffffff' }
          ], win ? '#7cff4f' : '#ff5252');
        }
      }

      // 同步 SKILL 按鈕發光狀態
      let lastSkillReady = null;
      function syncSkillButton() {
        const ready = state === 'playing' && resonance >= RESONANCE_MAX;
        if (ready !== lastSkillReady) {
          skillBtn.classList.toggle('ready', ready);
          lastSkillReady = ready;
        }
      }

      // ===== 主迴圈 =====
      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        render();
        syncSkillButton();
        requestAnimationFrame(loop);
      }

      resetGame();
      player.y = GROUND_Y - PLAYER.size;
      requestAnimationFrame(loop);
    })();

    // ===== PWA：註冊 Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then((reg) => {
            console.log('[PWA] Service Worker 註冊成功，scope：', reg.scope);
          })
          .catch((err) => {
            console.warn('[PWA] Service Worker 註冊失敗：', err);
          });
      });
    }
  </script>
</body>
</html>
